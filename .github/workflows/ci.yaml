name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f unittests/requirements.txt ]; then pip install -r unittests/requirements.txt; fi
          # The client version lives in manifest.json and nowhere else. A second
          # pin in a requirements file tests a version the integration does not
          # declare, and says nothing when the two drift apart.
          pip install "$(python -c 'import json; print(json.load(open("custom_components/bosch/manifest.json"))["requirements"][0])')"
          pip install tzdata

      - name: Lint with Ruff
        run: |
          # Check for syntax errors or bad style
          ruff check --exclude deric-bosch-client --exclude unittests .

      - name: Run Tests
        run: |
          # pipefail is NOT on by default in Actions' `bash -e {0}`, and without
          # it `tee` would swallow pytest's exit code — including the
          # --cov-fail-under gate, which would then never fail the build.
          set -o pipefail
          python3 -m pytest --tb=short -q unittests --override-ini="asyncio_mode=auto" \
            --cov=custom_components/bosch --cov-report=term --cov-fail-under=70 \
            | tee pytest.log

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            sed -n '/^Name /,/^TOTAL/p' pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
