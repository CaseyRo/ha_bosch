[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["unittests"]

[tool.ruff.lint]
# Pin ruff's historical default rule set: CI installs ruff unpinned, and a
# newer ruff broadened its defaults (BLE/DTZ/ASYNC/...), flagging 69
# pre-existing spots repo-wide. This keeps the gate at the rules the code
# was written against.
select = ["E4", "E7", "E9", "F"]
# __init__.py must patch builtins.print before other imports (E402)
# and uses a lambda for a simple callback (E731)
per-file-ignores = {"__init__.py" = ["E402", "E731"]}
